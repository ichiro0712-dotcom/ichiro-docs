<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ichiro-docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #0a0a0a;
    --foreground: #fafafa;
    --muted: #171717;
    --muted-foreground: #a3a3a3;
    --border: #262626;
    --border-hover: #404040;
    --primary: #fafafa;
    --primary-foreground: #0a0a0a;
    --primary-10: rgba(255, 255, 255, 0.06);
    --primary-20: rgba(255, 255, 255, 0.12);
    --card-hover: rgba(255, 255, 255, 0.02);
    --radius: 0.625rem;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--background);
    color: var(--foreground);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }

  a { color: inherit; text-decoration: none; }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1152px;
    margin: 0 auto;
    padding: 0 16px;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
  }

  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--primary);
    color: var(--primary-foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }

  .header-spacer { flex: 1; }

  /* Main */
  .main {
    max-width: 1152px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .page-header {
    margin-bottom: 24px;
  }

  .page-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .page-description {
    font-size: 14px;
    color: var(--muted-foreground);
    margin-top: 4px;
  }

  /* Grid */
  .grid {
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* Card */
  .card {
    display: block;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.15s ease, background-color 0.15s ease;
    cursor: pointer;
  }

  .card:hover {
    border-color: var(--border-hover);
    background: var(--card-hover);
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--primary-10);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease;
    flex-shrink: 0;
  }

  .card:hover .card-icon {
    background: var(--primary-20);
  }

  .card-icon svg {
    width: 18px;
    height: 18px;
    color: var(--foreground);
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .card-description {
    font-size: 12px;
    color: var(--muted-foreground);
    line-height: 1.5;
  }

  /* Footer */
  .footer {
    max-width: 1152px;
    margin: 48px auto 0;
    padding: 24px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted-foreground);
  }

  .footer a:hover { color: var(--foreground); }
</style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">I</div>
        <span>ichiro-docs</span>
      </div>
      <div class="header-spacer"></div>
    </div>
  </header>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        Documents
      </h1>
      <p class="page-description">ドキュメント・資料の一覧</p>
    </div>

    <div class="grid">
      <a href="fulfull_investor_deck_2.html" class="card">
        <div class="card-head">
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          </div>
          <h3 class="card-title">Fulfull Investor Deck</h3>
        </div>
        <p class="card-description">60代女性向け健康特化コミュニティ「フルフル」の投資家向け資料</p>
      </a>

      <a href="jr-west-career.html" class="card">
        <div class="card-head">
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16"/><path d="M12 3v8"/><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M8 19v2"/><path d="M16 19v2"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>
          </div>
          <h3 class="card-title">JR西日本キャリア</h3>
        </div>
        <p class="card-description">JR西日本のキャリア関連資料</p>
      </a>
    </div>
  </main>

  <footer class="footer">
    <a href="https://github.com/ichiro0712-dotcom/ichiro-docs">GitHub</a>
  </footer>
</body>
</html>
