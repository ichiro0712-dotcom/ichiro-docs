var K='cost-review-pw:'+location.pathname.split('/').pop();
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function open(pw){
  if(!window.crypto||!crypto.subtle)return Promise.reject(new Error('このブラウザでは開けません (https で開いてください)'));
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.c));})
    .then(function(b){var h=new TextDecoder().decode(b);document.open();document.write(h);document.close();});
}

});
