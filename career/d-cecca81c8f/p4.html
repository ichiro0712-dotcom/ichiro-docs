<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Protected document</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --line: rgba(11, 11, 11, 0.12);
    --accent: #1c5cab;
    --accent-ink: #ffffff;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #3987e5;
      --accent-ink: #0b0b0b;
      --critical: #e66767;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--plane);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px 24px;
  }
  .icon { width: 28px; height: 28px; color: var(--ink-2); margin-bottom: 14px; }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  p { font-size: 13px; color: var(--ink-2); line-height: 1.7; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--plane);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  .error { min-height: 20px; margin-top: 10px; font-size: 12px; color: var(--critical); }
</style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <h1>保護されたドキュメント</h1>
    <p>閲覧にはパスワードが必要です。</p>
    <form id="unlock" autocomplete="on">
      <label for="pw">パスワード</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="go" type="submit">開く</button>
      <div class="error" id="err" role="alert" aria-live="polite"></div>
    </form>
  </main>

          remember(saved[i]);
          show(html);
          return;
        } catch (e) {}
      }
      btn.disabled = false;
      btn.textContent = '開く';
    })();
  }
})();
</script>
